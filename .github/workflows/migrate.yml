name: Migrar caratulas

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "tabla.columna separadas por comas (vacio = todas)"
        default: ""
      limit:
        description: "Maximo de caratulas (0 = todas)"
        default: "20"
      dry:
        description: "Simulacion (no escribe nada)"
        type: boolean
        default: true
      max_minutes:
        description: "Cortar pasados estos minutos"
        default: "300"

permissions:
  contents: write

concurrency:
  group: migrar-caratulas
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund --no-package-lock

      - name: Migrar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGETS: ${{ inputs.targets }}
          LIMIT: ${{ inputs.limit }}
          DRY: ${{ inputs.dry }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
        run: node scripts/migrate.mjs
