name: Migrar caratulas

on:
  # Cada día a las 04:30 UTC (06:30 en Madrid en verano, 05:30 en invierno),
  # después del Dedup Nightly: pasa a GitHub las portadas nuevas del pipeline
  # y reintenta las que fallaron. Sin inputs = todas las tablas, sin límite, real.
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "tabla.columna separadas por comas (vacio = todas)"
        default: ""
      limit:
        description: "Maximo de caratulas (0 = todas)"
        default: "20"
      dry:
        description: "Simulacion (no escribe nada)"
        type: boolean
        default: true
      max_minutes:
        description: "Cortar pasados estos minutos"
        default: "300"

permissions:
  contents: write

concurrency:
  group: migrar-caratulas
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund --no-package-lock

      - name: Migrar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGETS: ${{ inputs.targets }}
          LIMIT: ${{ inputs.limit }}
          DRY: ${{ inputs.dry }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
        run: node scripts/migrate.mjs

      # Después de migrar, borra del bucket telegram-covers de Supabase las
      # copias que ya no usa ningún libro (ya están en GitHub) y tienen más de
      # 48 h (para entonces las cachés nocturnas ya se han regenerado). Solo en la
      # ejecución programada y en las reales, nunca en simulación. Si falla,
      # no pasa nada: se reintenta al día siguiente.
      - name: Limpiar bucket de Supabase
        if: ${{ github.event_name == 'schedule' || inputs.dry == false }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in 1 2 3; do
            curl -s -m 70 "https://bookvault-dusky.vercel.app/api/telegram/clean-orphan-covers?secret=${CRON_SECRET}&force=1&min_horas=48" || true
            echo
          done
